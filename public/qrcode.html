<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conectar WhatsApp - Agenda de Clientes</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #f5f3f0;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .qr-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .qr-container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .qr-image-wrapper {
      background: white;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid #e5e5e5;
      margin: 0 auto 24px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .qr-image-wrapper img {
      width: 280px;
      height: 280px;
      display: block;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 32px;
      font-size: 14px;
      color: #666;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .qr-instructions {
      background: #fafafa;
      border-radius: 16px;
      padding: 32px;
      text-align: left;
      margin-top: 32px;
    }

    .qr-instructions h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 24px 0;
      color: #333;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .instructions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .platform-instructions {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
    }

    .platform-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-weight: 600;
      color: #333;
      font-size: 15px;
    }

    .platform-icon {
      font-size: 20px;
    }

    .instruction-step {
      margin-bottom: 12px;
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      padding-left: 20px;
      position: relative;
    }

    .instruction-step:before {
      content: attr(data-step);
      position: absolute;
      left: 0;
      font-weight: 600;
      color: #10b981;
    }

    .instruction-step:last-child {
      margin-bottom: 0;
    }

    .success-message {
      background: #d1fae5;
      color: #065f46;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      display: none;
      margin-bottom: 24px;
      border: 1px solid #10b981;
    }

    .success-message.show {
      display: block;
    }

    .back-button {
      margin-top: 32px;
    }

    .back-button button {
      background: transparent;
      border: 1px solid #e5e5e5;
      color: #666;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-button button:hover {
      background: #f5f5f5;
      border-color: #d4d4d4;
    }

    @media (max-width: 768px) {
      .qr-container {
        padding: 32px 24px;
      }

      .qr-image-wrapper img {
        width: 240px;
        height: 240px;
      }

      .instructions-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .status-row {
        flex-direction: column;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .qr-page {
        padding: 20px 16px;
      }

      .qr-container {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .qr-image-wrapper img {
        width: 200px;
        height: 200px;
      }

      .qr-instructions {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  
  <div class="qr-page">
    <div class="qr-container">
      <div id="successMessage" class="success-message">
        ✅ WhatsApp conectado com sucesso!
      </div>

      <div class="qr-image-wrapper">
        <img id="qrImage" alt="QR Code para conectar WhatsApp" />
      </div>

      <div class="status-row">
        <div class="status-item">
          <span class="status-dot"></span>
          <span id="qrTimer">Atualizando em 60s</span>
        </div>
        <div class="status-item">
          <span class="status-dot"></span>
          <span id="connectionStatus">Aguardando conexão...</span>
        </div>
      </div>

      <div class="qr-instructions">
        <h2>Como Conectar:</h2>
        <div class="instructions-grid">
          <div class="platform-instructions">
            <div class="platform-header">
              <span class="platform-icon">🤖</span>
              <span>Android</span>
            </div>
            <div class="instruction-step" data-step="1.">Menu (3 pontos)</div>
            <div class="instruction-step" data-step="2.">Aparelhos conectados</div>
            <div class="instruction-step" data-step="3.">Conectar aparelho</div>
          </div>
          
          <div class="platform-instructions">
            <div class="platform-header">
              <span class="platform-icon">🍎</span>
              <span>iPhone</span>
            </div>
            <div class="instruction-step" data-step="1.">Configurações</div>
            <div class="instruction-step" data-step="2.">Aparelhos conectados</div>
            <div class="instruction-step" data-step="3.">Conectar aparelho</div>
          </div>
        </div>
      </div>

      <div class="back-button">
        <a href="/" style="text-decoration: none;">
          <button>← Voltar ao início</button>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Fazer logout automaticamente ao carregar a página
    (async () => {
      try {
        await fetch('/logout', { method: 'POST' });
      } catch (err) {
        // Silently fail
      }
    })();

    // Obter dados da URL
    const urlParams = new URLSearchParams(window.location.search);
    const qrCodeUrl = urlParams.get('qr');
    const companyName = urlParams.get('company');

    if (!qrCodeUrl) {
      window.location.href = '/';
    }

    // Exibir QR Code
    const qrImage = document.getElementById('qrImage');
    qrImage.src = qrCodeUrl;

    // Timer de renovação
    let qrTimeLeft = 60;
    const qrTimerDiv = document.getElementById('qrTimer');
    const connectionStatusDiv = document.getElementById('connectionStatus');
    
    const updateTimer = () => {
      qrTimerDiv.textContent = `Atualizando em ${qrTimeLeft}s`;
    };
    
    updateTimer();

    const countdownTimer = setInterval(() => {
      qrTimeLeft--;
      if (qrTimeLeft <= 0) qrTimeLeft = 0;
      updateTimer();
    }, 1000);

    // Refresh do QR a cada 60 segundos
    const refreshTimer = setInterval(() => {
      qrTimeLeft = 60;
      updateTimer();
      
      if (qrCodeUrl.startsWith('data:')) {
        qrImage.src = qrCodeUrl;
      } else {
        let url = qrCodeUrl.replace(/[&?]t=\d{13,}/, '');
        url = url.replace(/[?&]$/, '');
        qrImage.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      }
    }, 60 * 1000);

    // Toast helper
    const toast = document.getElementById('toast');
    const showToast = (message, type = 'ok') => {
      toast.textContent = message;
      toast.className = 'toast ' + (type === 'ok' ? 'ok' : 'err') + ' show';
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    };

    // Verificar conexão a cada 4 segundos
    if (companyName) {
      const checkTimer = setInterval(async () => {
        try {
          const resp = await fetch('/check-connection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ companyName })
          });
          const result = await resp.json();
          
          if (result.connected) {
            clearInterval(countdownTimer);
            clearInterval(refreshTimer);
            clearInterval(checkTimer);
            
            document.getElementById('successMessage').classList.add('show');
            connectionStatusDiv.textContent = 'WhatsApp conectado! ✅';
            qrTimerDiv.textContent = 'Conectado';
            showToast('WhatsApp conectado com sucesso! ✅', 'ok');
            
            // Redireciona após 3 segundos
            setTimeout(() => {
              window.location.href = '/';
            }, 3000);
          }
        } catch (e) {
          // Silently continue checking
        }
      }, 4000);
    }

    // Cleanup ao sair da página
    window.addEventListener('beforeunload', () => {
      if (countdownTimer) clearInterval(countdownTimer);
      if (refreshTimer) clearInterval(refreshTimer);
    });
  </script>
</body>
</html>
