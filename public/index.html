<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro - Agenda de Clientes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  
  <div class="container">
    <h1>OS SEUS DADOS</h1>
    <p class="subtitle">Preencha os campos abaixo para completar seu cadastro</p>
    
    <!-- Auth Section -->
    <div class="auth-section">
      <h2>Acesso</h2>
      <div id="not-logged" class="hidden">
        <p style="color: var(--text-light); font-size: 14px; margin-bottom: 12px;">
          Entre com sua conta Google para autorizar a criação de calendários.
        </p>
        <a id="loginBtn" href="/auth/google/initiate" style="text-decoration: none;">
          <button class="btn-primary" type="button" aria-label="Entrar com Google">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17.64 9.2045c0-.638-.057-1.251-.164-1.84H9v3.486h4.844c-.21 1.137-.84 2.1-1.795 2.747v2.286h2.904c1.7-1.566 2.687-3.88 2.687-6.679z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.47-.8 5.96-2.168l-2.904-2.286C11.54 13.01 10.34 13.6 9 13.6c-2.3 0-4.25-1.55-4.947-3.634H1.01v2.283C2.5 15.86 5.53 18 9 18z" fill="#34A853"/>
              <path d="M4.053 10.0c-.218-.66-.218-1.367 0-2.027V5.69H1.01C.364 6.907.0 8.385.0 10c0 1.615.364 3.093 1.01 4.31l3.043-2.31z" fill="#FBBC05"/>
              <path d="M9 3.8c1.32 0 2.51.45 3.447 1.325l2.58-2.58C13.47 1.34 11.43.4 9 .4 5.53.4 2.5 2.54 1.01 5.69l3.043 2.283C4.75 5.35 6.7 3.8 9 3.8z" fill="#EA4335"/>
            </svg>
            <span>Entrar com Google</span>
          </button>
        </a>
      </div>
      <div id="logged" class="hidden">
        <div class="auth-info">
          <div class="user-email">Logado como <strong id="userEmail"></strong></div>
          <button class="btn-secondary" id="logoutBtn">Sair</button>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <h2>Dados do Cadastro</h2>
      <form id="calForm">
        <!-- Nome e sobrenome -->
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Nome e sobrenome</label>
            <div class="input-wrapper">
              <input type="text" id="fullName" name="fullName" placeholder="Digite seu nome completo" required />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- E-mail e Confirme o E-mail -->
        <div class="form-row two-cols">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" placeholder="seu@email.com" required />
            </div>
            <div class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="confirmEmail">Confirme o E-mail</label>
            <div class="input-wrapper">
              <input type="email" id="confirmEmail" name="confirmEmail" placeholder="seu@email.com" required />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Celular e CPF/CNPJ -->
        <div class="form-row two-cols">
          <div class="form-group">
            <label for="phone">Celular</label>
            <div class="input-wrapper phone-input">
              <span class="flag">🇧🇷</span>
              <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000" required />
            </div>
            <div class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="document">CPF / CNPJ</label>
            <div class="input-wrapper">
              <input type="text" id="document" name="document" placeholder="000.000.000-00" required />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Nome da Empresa -->
        <div class="form-row">
          <div class="form-group">
            <label for="company">Nome da Empresa</label>
            <div class="input-wrapper">
              <input type="text" id="company" name="company" placeholder="Ex.: Empresa XYZ" required />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- CEP -->
        <div class="form-row">
          <div class="form-group">
            <label for="cep">CEP</label>
            <div class="input-wrapper">
              <input type="text" id="cep" name="cep" placeholder="00000-000" required />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Endereço (Rua) -->
        <div class="form-row hidden" id="streetRow">
          <div class="form-group">
            <label for="street">Endereço (Rua)</label>
            <div class="input-wrapper">
              <input type="text" id="street" name="street" placeholder="Rua, Avenida, etc." required readonly />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Número e Complemento -->
        <div class="form-row two-cols hidden" id="numberRow">
          <div class="form-group">
            <label for="number">Número</label>
            <div class="input-wrapper">
              <input type="text" id="number" name="number" placeholder="Ex.: 123" required />
            </div>
            <div class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="complement">Complemento</label>
            <div class="input-wrapper">
              <input type="text" id="complement" name="complement" placeholder="Apto, Sala, etc. (opcional)" />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Bairro e Cidade -->
        <div class="form-row two-cols hidden" id="cityRow">
          <div class="form-group">
            <label for="neighborhood">Bairro</label>
            <div class="input-wrapper">
              <input type="text" id="neighborhood" name="neighborhood" placeholder="Bairro" required readonly />
            </div>
            <div class="error-message"></div>
          </div>
          <div class="form-group">
            <label for="city">Cidade</label>
            <div class="input-wrapper">
              <input type="text" id="city" name="city" placeholder="Cidade" required readonly />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Estado -->
        <div class="form-row hidden" id="stateRow">
          <div class="form-group">
            <label for="state">Estado</label>
            <div class="input-wrapper">
              <input type="text" id="state" name="state" placeholder="UF" required readonly />
            </div>
            <div class="error-message"></div>
          </div>
        </div>

        <!-- Hidden fields for backend compatibility -->
        <input type="hidden" id="summary" name="summary" />
        <input type="hidden" id="tz" name="tz" value="America/Sao_Paulo" />

        <!-- Submit -->
        <div class="submit-wrapper">
          <button type="submit" id="submitBtn" class="btn-primary">
            <span id="btnSpinner" class="spinner" aria-hidden="true"></span>
            <span id="btnText">Criar cadastro</span>
          </button>
          <div id="formStatus" class="status" role="status" aria-live="polite"></div>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
